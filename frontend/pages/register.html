<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Sports Bet Management</title>
  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'system';
      var resolved = t === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
      document.documentElement.setAttribute('data-theme', resolved);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="card shadow-sm" style="width:100%; max-width:400px;">
    <div class="card-body p-4">
      <h1 class="h4 fw-bold mb-1" data-i18n="register">Register</h1>
      <p class="text-muted mb-4">Start tracking your sports betting activity.</p>
      <form id="register-form" novalidate>
        <div class="mb-3">
          <label class="form-label" data-i18n="name">Name</label>
          <input type="text" name="name" class="form-control" required minlength="2">
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="email">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="password">Password</label>
          <input type="password" name="password" class="form-control" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary w-100" data-i18n="register">Register</button>
      </form>
      <p class="text-center text-muted mt-3 mb-0">Already have an account? <a href="/login">Login</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/translations/en.js"></script>
  <script src="/translations/kh.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/animation.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
