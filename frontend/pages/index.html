<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sports Bet Management</title>

    <script>
      (function () {
        var t = localStorage.getItem("theme") || "system";
        var resolved =
          t === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t;
        document.documentElement.setAttribute("data-theme", resolved);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <div id="app" class="d-flex gap-2 p-4">
      <button type="button" class="btn btn-outline-secondary" data-theme-toggle>
        <i class="bi bi-moon-stars"></i>
      </button>

      <div class="btn-group" role="group" aria-label="Language">
        <button type="button" class="btn btn-outline-secondary" data-lang="en">
          English
        </button>
        <button type="button" class="btn btn-outline-secondary" data-lang="kh">
          ខ្មែរ
        </button>
      </div>

      <div id="auth-status" class="mt-3"></div>

      <span data-i18n="dashboard" class="fw-semibold ms-3"></span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/translations/en.js"></script>
    <script src="/translations/kh.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/language.js"></script>
    <script src="../js/animation.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>

    <script>
      (async function () {
        const el = document.getElementById("auth-status");
        try {
          const res = await fetch("/api/auth/me", {
            credentials: "same-origin",
          });
          if (res.ok) {
            const { user } = await res.json();
            el.innerHTML = `Logged in as <strong>${user.name}</strong> (${user.role}) — <a href="#" id="logout-link">Logout</a>`;
            document
              .getElementById("logout-link")
              .addEventListener("click", async (e) => {
                e.preventDefault();
                await fetch("/api/auth/logout", {
                  method: "POST",
                  credentials: "same-origin",
                });
                window.location.reload();
              });
          } else {
            el.innerHTML = `<a href="/login">Login</a> or <a href="/register">Register</a>`;
          }
        } catch (err) {
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
